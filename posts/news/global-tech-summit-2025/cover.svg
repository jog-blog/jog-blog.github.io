<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3949ab;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)" />

  <!-- Globe -->
  <circle cx="400" cy="200" r="120" fill="#e3f2fd" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.9;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="200" r="120" fill="url(#glowGradient)" />

  <!-- Globe Details -->
  <path d="M350 180 Q400 150 450 180" stroke="#bbdefb" stroke-width="8" fill="none" />
  <path d="M320 220 Q400 260 480 220" stroke="#bbdefb" stroke-width="12" fill="none" />
  <path d="M340 260 Q400 230 460 260" stroke="#bbdefb" stroke-width="6" fill="none" />

  <!-- AI Brain Icon -->
  <g transform="translate(400, 200) scale(0.8)">
    <circle cx="0" cy="-20" r="30" fill="#90caf9" />
    <circle cx="-30" cy="20" r="20" fill="#90caf9" />
    <circle cx="30" cy="20" r="20" fill="#90caf9" />
    <circle cx="0" cy="50" r="25" fill="#90caf9" />

    <!-- Neural Connections -->
    <path d="M0 -50 Q-20 -30 -30 0" stroke="#ffffff" stroke-width="3" fill="none" />
    <path d="M0 -50 Q20 -30 30 0" stroke="#ffffff" stroke-width="3" fill="none" />
    <path d="M-30 0 Q-15 15 0 30" stroke="#ffffff" stroke-width="3" fill="none" />
    <path d="M30 0 Q15 15 0 30" stroke="#ffffff" stroke-width="3" fill="none" />
    <path d="M-30 40 Q-15 45 0 50" stroke="#ffffff" stroke-width="3" fill="none" />
    <path d="M30 40 Q15 45 0 50" stroke="#ffffff" stroke-width="3" fill="none" />

    <!-- Circuit Lines -->
    <path d="M-40 -20 L-20 -20 L-20 0 L-40 0 Z" stroke="#ffffff" stroke-width="2" fill="none" />
    <path d="M40 -20 L20 -20 L20 0 L40 0 Z" stroke="#ffffff" stroke-width="2" fill="none" />
  </g>

  <!-- Summit Flags -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="10" height="40" fill="#333" />
    <rect x="10" y="0" width="20" height="15" fill="#e74c3c" />
    <rect x="10" y="15" width="20" height="10" fill="#f1c40f" />
    <rect x="10" y="25" width="20" height="15" fill="#27ae60" />
  </g>

  <g transform="translate(620, 180)">
    <rect x="0" y="0" width="8" height="35" fill="#333" />
    <rect x="8" y="0" width="20" height="20" fill="#3498db" />
    <circle cx="18" cy="10" r="6" fill="#ffffff" />
  </g>

  <!-- Text -->
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Global Tech Summit 2025
  </text>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="16" fill="#bbdefb" text-anchor="middle">
    AI Governance Framework
  </text>
</svg>
