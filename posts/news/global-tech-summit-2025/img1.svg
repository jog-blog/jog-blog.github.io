<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="550" fill="url(#bgGrad)" />

  <!-- Title -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50" text-anchor="middle">
    Global AI Governance Framework
  </text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="18" fill="#6c757d" text-anchor="middle">
    Core Principles
  </text>

  <!-- Principles Cards -->

  <!-- Transparency -->
  <g transform="translate(80, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="200" rx="12" fill="url(#cardGrad)" stroke="#2196f3" stroke-width="3" />
    <circle cx="80" cy="50" r="30" fill="#2196f3">
      <animate attributeName="fill" values="#2196f3;#42a5f5;#2196f3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">
      🔍
    </text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">
      Transparency
    </text>
    <text x="80" y="130" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      AI systems must be explainable
    </text>
    <text x="80" y="150" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      and their decision-making processes
    </text>
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      understandable
    </text>
  </g>

  <!-- Fairness -->
  <g transform="translate(270, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="200" rx="12" fill="url(#cardGrad)" stroke="#4caf50" stroke-width="3" />
    <circle cx="80" cy="50" r="30" fill="#4caf50">
      <animate attributeName="fill" values="#4caf50;#66bb6a;#4caf50" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">
      ⚖️
    </text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">
      Fairness
    </text>
    <text x="80" y="130" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      AI must not perpetuate
    </text>
    <text x="80" y="150" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      or amplify existing biases
    </text>
  </g>

  <!-- Safety -->
  <g transform="translate(460, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="200" rx="12" fill="url(#cardGrad)" stroke="#ff9800" stroke-width="3" />
    <circle cx="80" cy="50" r="30" fill="#ff9800">
      <animate attributeName="fill" values="#ff9800;#ffa726;#ff9800" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">
      🛡️
    </text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">
      Safety
    </text>
    <text x="80" y="130" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      AI systems must be designed
    </text>
    <text x="80" y="150" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      with robust safeguards
    </text>
  </g>

  <!-- Accountability -->
  <g transform="translate(175, 340)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="220" rx="12" fill="url(#cardGrad)" stroke="#f44336" stroke-width="3" />
    <circle cx="80" cy="50" r="30" fill="#f44336">
      <animate attributeName="fill" values="#f44336;#ef5350;#f44336" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">
      📝
    </text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">
      Accountability
    </text>
    <text x="80" y="130" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      Clear mechanisms for
    </text>
    <text x="80" y="150" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      responsibility when
    </text>
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      AI systems cause harm
    </text>
  </g>

  <!-- Privacy -->
  <g transform="translate(465, 340)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="220" rx="12" fill="url(#cardGrad)" stroke="#9c27b0" stroke-width="3" />
    <circle cx="80" cy="50" r="30" fill="#9c27b0">
      <animate attributeName="fill" values="#9c27b0;#ab47bc;#9c27b0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle">
      🔒
    </text>
    <text x="80" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50" text-anchor="middle">
      Privacy
    </text>
    <text x="80" y="130" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      Protection of individual
    </text>
    <text x="80" y="150" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      data rights in AI
    </text>
    <text x="80" y="170" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle" width="140">
      development
    </text>
  </g>

  <!-- Connecting Lines -->
  <path d="M240 260 Q260 260 270 280" stroke="#dee2e6" stroke-width="2" fill="none" stroke-dasharray="5,5" />
  <path d="M430 260 Q450 260 460 280" stroke="#dee2e6" stroke-width="2" fill="none" stroke-dasharray="5,5" />
  <path d="M160 320 Q160 340 175 340" stroke="#dee2e6" stroke-width="2" fill="none" stroke-dasharray="5,5" />
  <path d="M540 320 Q540 340 525 340" stroke="#dee2e6" stroke-width="2" fill="none" stroke-dasharray="5,5" />

  <!-- Decorative Elements -->
  <circle cx="70" cy="70" r="4" fill="#2196f3" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="730" cy="400" r="4" fill="#9c27b0" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="60" r="4" fill="#4caf50" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
