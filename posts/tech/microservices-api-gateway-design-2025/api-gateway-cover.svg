<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serviceGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>

  <!-- 网格背景 -->
  <g opacity="0.1">
    <path d="M0 0 L800 0 M0 40 L800 40 M0 80 L800 80 M0 120 L800 120 M0 160 L800 160 M0 200 L800 200 M0 240 L800 240 M0 280 L800 280 M0 320 L800 320 M0 360 L800 360" stroke="#f1f5f9" stroke-width="1"/>
    <path d="M0 0 L0 400 M40 0 L40 400 M80 0 L80 400 M120 0 L120 400 M160 0 L160 400 M200 0 L200 400 M240 0 L240 400 M280 0 L280 400 M320 0 L320 400 M360 0 L360 400 M400 0 L400 400 M440 0 L440 400 M480 0 L480 400 M520 0 L520 400 M560 0 L560 400 M600 0 L600 400 M640 0 L640 400 M680 0 L680 400 M720 0 L720 400 M760 0 L760 400" stroke="#f1f5f9" stroke-width="1"/>
  </g>

  <!-- 标题 -->
  <text x="400" y="80" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="32" font-weight="bold">API网关设计</text>
  <text x="400" y="120" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">微服务架构的核心组件</text>

  <!-- API网关图标 -->
  <rect x="350" y="180" width="100" height="60" fill="url(#gatewayGradient)" rx="8"/>
  <text x="400" y="215" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">API网关</text>

  <!-- 微服务节点 -->
  <circle cx="200" cy="210" r="25" fill="url(#serviceGradient1)"/>
  <text x="200" y="215" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">用户服务</text>

  <circle cx="600" cy="210" r="25" fill="url(#serviceGradient2)"/>
  <text x="600" y="215" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">产品服务</text>

  <circle cx="200" cy="280" r="25" fill="url(#serviceGradient3)"/>
  <text x="200" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">订单服务</text>

  <circle cx="600" cy="280" r="25" fill="#8b5cf6"/>
  <text x="600" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">支付服务</text>

  <!-- 连接线 -->
  <line x1="225" y1="210" x2="350" y2="210" stroke="#5eead4" stroke-width="3"/>
  <line x1="450" y1="210" x2="575" y2="210" stroke="#5eead4" stroke-width="3"/>
  <line x1="225" y1="280" x2="350" y2="280" stroke="#5eead4" stroke-width="3"/>
  <line x1="450" y1="280" x2="575" y2="280" stroke="#5eead4" stroke-width="3"/>

  <!-- 箭头 -->
  <path d="M350 210 L340 205 L340 215 Z" fill="#5eead4"/>
  <path d="M450 210 L460 205 L460 215 Z" fill="#5eead4"/>
  <path d="M350 280 L340 275 L340 285 Z" fill="#5eead4"/>
  <path d="M450 280 L460 275 L460 285 Z" fill="#5eead4"/>

  <!-- 功能标签 -->
  <rect x="50" y="320" width="700" height="60" fill="#334155" rx="8"/>
  <text x="400" y="340" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="16" font-weight="bold">核心功能：路由转发 · 认证授权 · 限流熔断 · 监控日志</text>

  <!-- 装饰元素 -->
  <circle cx="100" cy="100" r="3" fill="#5eead4" opacity="0.6"/>
  <circle cx="700" cy="150" r="2" fill="#5eead4" opacity="0.4"/>
  <circle cx="150" cy="350" r="2" fill="#5eead4" opacity="0.3"/>
  <circle cx="650" cy="50" r="2" fill="#5eead4" opacity="0.5"/>
</svg>
