<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgGradient)" rx="8"/>

  <!-- 标题 -->
  <text x="300" y="30" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="16" font-weight="bold">API网关在微服务架构中的位置</text>

  <!-- 客户端 -->
  <rect x="50" y="80" width="100" height="60" fill="#10b981" rx="4"/>
  <text x="100" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">客户端</text>

  <!-- API网关 -->
  <rect x="250" y="70" width="100" height="80" fill="url(#gatewayGradient)" rx="4"/>
  <text x="300" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">API网关</text>

  <!-- 微服务 -->
  <circle cx="450" cy="100" r="25" fill="#f59e0b"/>
  <text x="450" y="105" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">用户服务</text>

  <circle cx="450" cy="150" r="25" fill="#ef4444"/>
  <text x="450" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">产品服务</text>

  <circle cx="450" cy="200" r="25" fill="#8b5cf6"/>
  <text x="450" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">订单服务</text>

  <!-- 连接线 -->
  <line x1="150" y1="110" x2="250" y2="110" stroke="#5eead4" stroke-width="2"/>
  <line x1="350" y1="110" x2="425" y2="100" stroke="#5eead4" stroke-width="2"/>
  <line x1="350" y1="110" x2="425" y2="150" stroke="#5eead4" stroke-width="2"/>
  <line x1="350" y1="110" x2="425" y2="200" stroke="#5eead4" stroke-width="2"/>

  <!-- 箭头 -->
  <path d="M150 110 L140 105 L140 115 Z" fill="#5eead4"/>
  <path d="M350 110 L360 105 L360 115 Z" fill="#5eead4"/>

  <!-- 功能标签 -->
  <rect x="50" y="250" width="500" height="120" fill="#334155" rx="4"/>
  <text x="300" y="270" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">网关核心功能</text>

  <text x="100" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">路由转发</text>
  <text x="200" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">认证授权</text>
  <text x="300" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">限流熔断</text>
  <text x="400" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">监控日志</text>
  <text x="500" y="300" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">协议转换</text>
</svg>
