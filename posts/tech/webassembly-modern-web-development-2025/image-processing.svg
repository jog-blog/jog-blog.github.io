<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wasmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#654ff0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGradient)"/>

  <!-- 标题 -->
  <text x="300" y="30" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="18" font-weight="bold">WebAssembly图像处理性能对比</text>

  <!-- 处理前图片 -->
  <rect x="50" y="80" width="200" height="150" fill="#475569" rx="8" stroke="#64748b" stroke-width="2"/>
  <rect x="70" y="100" width="160" height="110" fill="#3b82f6" rx="4"/>
  <text x="150" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">原图</text>
  <text x="150" y="145" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10">彩色图像</text>
  <text x="150" y="210" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">输入图像</text>

  <!-- 处理后图片 -->
  <rect x="350" y="80" width="200" height="150" fill="#334155" rx="8" stroke="#475569" stroke-width="2"/>
  <rect x="370" y="100" width="160" height="110" fill="#6b7280" rx="4"/>
  <text x="450" y="130" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">处理后</text>
  <text x="450" y="145" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10">灰度图像</text>
  <text x="450" y="210" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10">输出结果</text>

  <!-- 处理流程箭头 -->
  <path d="M270 155 L290 155 L290 145 L310 155 L290 165 L290 155 Z" fill="#5eead4"/>
  <rect x="290" y="145" width="60" height="20" fill="url(#wasmGradient)" rx="4"/>
  <text x="320" y="158" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">WASM处理</text>

  <!-- 性能对比图表 -->
  <rect x="50" y="250" width="500" height="120" fill="#1e293b" rx="8" stroke="#334155" stroke-width="2"/>
  <text x="300" y="270" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="14" font-weight="bold">性能对比（处理时间 ms）</text>

  <!-- JavaScript性能条 -->
  <rect x="80" y="300" width="200" height="20" fill="#ef4444" rx="4"/>
  <text x="180" y="315" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">JavaScript: 75ms</text>

  <!-- WebAssembly性能条 -->
  <rect x="80" y="330" width="40" height="20" fill="#10b981" rx="4"/>
  <text x="100" y="345" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">WASM: 15ms</text>

  <!-- 性能提升标签 -->
  <text x="350" y="320" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="12" font-weight="bold">性能提升: 5倍</text>
  <text x="350" y="340" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="10">处理速度显著提升</text>

  <!-- 代码示例 -->
  <rect x="80" y="360" width="440" height="25" fill="#0f172a" rx="4"/>
  <text x="85" y="375" fill="#5eead4" font-family="monospace" font-size="10">Rust + WebAssembly: 实时图像滤镜处理，内存安全高效</text>

  <!-- 装饰元素 -->
  <circle cx="550" y="50" r="3" fill="#5eead4" opacity="0.6"/>
  <circle cx="40" y="350" r="2" fill="#5eead4" opacity="0.4"/>
  <circle cx="580" y="380" r="2" fill="#5eead4" opacity="0.3"/>
</svg>
