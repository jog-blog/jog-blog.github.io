<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="rgba(0, 0, 0, 0.5)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="gradientBackground" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#6e7c9a; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2c3e50; stop-opacity:1"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gradientBackground)"/>
  
  <g filter="url(#textShadow)">
    <text x="600" y="270" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="40" font-weight="700" fill="white" text-anchor="middle">
      <tspan x="600" dy="0">云计算新动向：K8s生态系统</tspan>
      <tspan x="600" dy="62">与Serverless架构的</tspan>
      <tspan x="600" dy="62">最新发展</tspan>
    </text>
  </g>

  <text x="600" y="598" font-family="Arial, sans-serif" font-size="14" fill="white" 
        fill-opacity="0.5" text-anchor="middle" letter-spacing="2">TECH BLOG | 2026.01</text>

  <g>
    <circle cx="100" cy="100" r="20" fill="rgba(255, 255, 255, 0.3)"/>
