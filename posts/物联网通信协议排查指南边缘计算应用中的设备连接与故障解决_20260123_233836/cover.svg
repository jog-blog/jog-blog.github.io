<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="textShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
            <feOffset dx="2" dy="2" result="offsetBlur"/>
            <feFlood flood-color="black" flood-opacity="0.5"/>
            <feComposite in2="offsetBlur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <radialGradient id="gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#4A90E2; stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#9013FE; stop-opacity:1"/>
        </radialGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#gradient)"/>
    <g filter="url(#textShadow)">
        <text x="600" y="270" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" 
              font-weight="700" fill="white" text-anchor="middle">
            <tspan x="600" dy="0">物联网通信协议排查指南：边缘</tspan>
            <tspan x="600" dy="62">计算应用中的设备连接与故障解</tspan>
            <tspan x="600" dy="62">决</tspan>
        </text>
    </g>
    <text x="600" y="598" font-family="Arial, sans-serif" font-size="14" fill="white" 
          fill-opacity="0.5" text-anchor="middle" letter-spacing="2">TECH BLOG | 2026.01</text>
